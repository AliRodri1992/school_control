PreCommit:
  MinimumCommitFiles:
    enabled: true
    required: true
    command: ['./bin/check-commit-min-files', '--staged']

  TrailingWhitespace:
    enabled: true
  MergeConflicts:
    enabled: true
  SchoolLint:
    enabled: true
    required_executable: docker
    command: ['./bin/lint']
PrePush:
  SchoolQuality:
    enabled: true
    required_executable: docker
    command: ['./bin/quality']
