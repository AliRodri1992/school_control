    attributes:
      user:
        name: Nombre
        email: Correo
        password: Contraseña
        password_confirmation: Confirmación
        role: Perfil
      student:
        first_name: Nombre
        last_name: Apellidos
        curp: CURP
        birth_date: Fecha de nacimiento
        guardian: Tutor
      admission:
        grade_level: Grado
        student: Alumno
      group:
        capacity: Cupo
        section: Sección
      grade:
        score: Calificación
        term: Trimestre
