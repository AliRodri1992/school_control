services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: school
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
    command: ["bundle", "exec", "sidekiq", "-c", "5"]
    volumes:
      - school_uploads:/rails/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run bin/setup first}
      POSTGRES_DB: school_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_development"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: school
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - school_uploads:/rails/storage
    ports:
      - "127.0.0.1:${SCHOOL_BACKEND_PORT:-3200}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "127.0.0.1:${SCHOOL_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
volumes:
  redis_data:
  postgres_data:
  school_uploads:
  frontend_node_modules:
