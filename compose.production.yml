# Place a TLS reverse proxy in front of 127.0.0.1:8080.
# This override requires .env with SECRET_KEY_BASE and production DATABASE_URL.
services:
  worker:
    env_file: !override
      - .env
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set an independent secret}
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL URL}
      DEMO_SEEDS: "false"
  backend:
    # Only the frontend Nginx proxy is published in production.
    # Rails remains reachable as backend:3000 inside this Compose network.
    ports: !override []
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set a random production secret}
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
      DEMO_SEEDS: "false"
  frontend:
    build:
      target: production
    ports: !override
      - "127.0.0.1:8080:80"
