name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.5'
      - run: bundle install
      - run: bundle exec overcommit --install
      - run: bundle exec overcommit --sign
      - uses: actions/upload-artifact@v4
        with:
          name: hooks-lock
          path: Gemfile.lock
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school_ci
          POSTGRES_DB: school_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school -d school_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: school
      DB_PASSWORD: school_ci
      COVERAGE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.5'
          working-directory: backend
          bundler-cache: false
      - run: bundle install
      - uses: actions/upload-artifact@v4
        with:
          name: backend-lock
          path: backend/Gemfile.lock
      - run: bundle exec rails db:prepare
      - run: bundle exec rails db:schema:dump
      - uses: actions/upload-artifact@v4
        with:
          name: database-schema
          path: backend/db/schema.rb
      - run: bundle exec rails zeitwerk:check
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - run: bundle exec brakeman --no-pager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: cp .env.staging.example .env.staging
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml config --quiet
      - run: docker compose build
      - run: docker compose up -d db
      - run: docker compose run --rm backend bundle exec rails db:prepare db:seed
      - run: docker compose run --rm backend bundle exec rails db:seed
      - run: docker compose up -d --wait
      - run: curl --fail-with-body http://localhost:5173/api/school
      - run: docker compose run --rm backend bundle exec rails runner script/verify_worker.rb
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml build
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml run --rm backend bundle exec rails db:prepare db:seed
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml up -d --wait
      - run: |
          curl --fail-with-body -H 'X-Forwarded-Proto: https' http://localhost:8180/api/school
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml run --rm backend bundle exec rails runner 'abort "Staging mail enabled" if ActionMailer::Base.perform_deliveries'
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml logs
        if: failure()
      - run: docker compose logs
        if: failure()
