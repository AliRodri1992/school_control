name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.5'
      - run: bundle install
      - run: bundle exec overcommit --install
      - run: bundle exec overcommit --sign
      - uses: actions/upload-artifact@v4
        with:
          name: hooks-lock
          path: Gemfile.lock
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school_ci
          POSTGRES_DB: school_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school -d school_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: school
      DB_PASSWORD: school_ci
      COVERAGE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.5'
          working-directory: backend
          bundler-cache: false
      - run: bundle install
      - uses: actions/upload-artifact@v4
        with:
          name: backend-lock
          path: backend/Gemfile.lock
      - run: bundle exec rails db:prepare
      - run: bundle exec rails db:schema:dump
      - uses: actions/upload-artifact@v4
        with:
          name: database-schema
          path: backend/db/schema.rb
      - run: bundle exec rails zeitwerk:check
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - run: bundle exec brakeman --no-pager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: cp .env.staging.example .env.staging
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml config --quiet
      - name: Validate host port isolation from Delta POS
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          def inspect(*args):
              result = subprocess.check_output(
                  ["docker", "compose", *args, "config", "--format", "json"],
                  text=True,
              )
              return json.loads(result)["services"]

          expected = {
              "development": (inspect(), {"backend": 3200, "frontend": 5173}),
              "staging": (
                  inspect("--project-name", "school-staging", "--env-file", ".env.staging",
                          "-f", "compose.yml", "-f", "compose.staging.yml"),
                  {"backend": 3100, "frontend": 8180},
              ),
          }
          for name, (services, published_expected) in expected.items():
              exposed = {}
              for service, configuration in services.items():
                  for mapping in configuration.get("ports", []):
                      host = int(mapping["published"])
                      assert host not in (3000, 5432, 6379), (name, service, host)
                      assert mapping.get("host_ip") == "127.0.0.1", (name, service, mapping)
                      assert host not in exposed, (name, service, exposed[host])
                      exposed[host] = service
              for service, port in published_expected.items():
                  assert exposed.get(port) == service, (name, service, port, exposed)
              assert not services["db"].get("ports")
              assert not services["redis"].get("ports")
              print(f"{name}: isolated ports {exposed}")
          PY
      - name: Verify production exposes only the Nginx entrypoint
        env:
          SECRET_KEY_BASE: ci-only-production-compose-validation
          DATABASE_URL: postgresql://school:ci-check@db:5432/school_production
        run: |
          docker compose -f compose.yml -f compose.production.yml config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          assert not services["backend"].get("ports"), "Rails must not be exposed in production"
          assert not services["db"].get("ports")
          assert not services["redis"].get("ports")
          ports = services["frontend"]["ports"]
          assert len(ports) == 1 and int(ports[0]["published"]) == 8080
          assert ports[0]["host_ip"] == "127.0.0.1"
          print("production: localhost:8080 only")
          '
      - run: docker compose build
      - name: Start PostgreSQL (retry transient registry errors)
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d db; then exit 0; fi
            echo "Docker registry or image pull failed on attempt $attempt"
            sleep 12
          done
          exit 1
      - run: docker compose run --rm backend bundle exec rails db:prepare db:seed
      - run: docker compose run --rm backend bundle exec rails db:seed
      - name: Boot School Control while another Rails server occupies host port 3000
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 >/tmp/another-rails.log 2>&1 &
          occupied_port_pid=$!
          trap 'kill "$occupied_port_pid" 2>/dev/null || true' EXIT
          sleep 1
          kill -0 "$occupied_port_pid"
          docker compose up -d --wait
          curl --fail-with-body http://127.0.0.1:3200/up
          curl --fail-with-body http://127.0.0.1:5173/api/school
      - run: docker compose run --rm backend bundle exec rails runner script/verify_worker.rb
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml build
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml run --rm backend bundle exec rails db:prepare db:seed
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml up -d --wait
      - run: |
          curl --fail-with-body -H 'X-Forwarded-Proto: https' http://localhost:8180/api/school
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml run --rm backend bundle exec rails runner 'abort "Staging mail enabled" if ActionMailer::Base.perform_deliveries'
      - run: docker compose --project-name school-staging --env-file .env.staging -f compose.yml -f compose.staging.yml logs
        if: failure()
      - run: docker compose logs
        if: failure()
